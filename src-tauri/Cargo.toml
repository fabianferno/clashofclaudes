[package]
license = "MIT"
name = "clash-of-claudes"
version = "0.2.5"
description = "Run all your coding agents from one village"
authors = ["Clash of Claudes contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clash_of_claudes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
portable-pty = "0.9"
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-updater = "2"

base64 = "0.22"
# Bug reports (`bugreport.rs`): the same reqwest and rustls the updater already builds. Named apart
# so tests keep their own plain-HTTP reqwest (dev-dependencies).
http_client = { package = "reqwest", version = "0.13", default-features = false, features = ["multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# App board snapshots: WKWebView's own snapshot of a hidden window (see `snapshot.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[dev-dependencies]
tempfile = "3"
toml = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc-macro dylibs stripped by the macOS toolchain fail to load ("mis-aligned LINKEDIT string
# pool"); strip only the final binary.
[profile.release.build-override]
strip = false

# Fast local installs (scripts/install-local.sh): release speed without LTO's long link, and
# incremental rebuilds. Never used for distributed builds.
[profile.local]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
strip = false
