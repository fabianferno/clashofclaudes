<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lilita-one.woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clash of Claudes</title>
    <!-- The splash: inline so it paints before any script, and covers the village and HUD until both are ready (src/splash.ts). -->
    <style>
      /* the splash's own copy of the bundle's font, so the wordmark never paints in a fallback */
      @font-face { font-family: "Lilita One"; font-weight: 400; font-display: block; src: url(/fonts/lilita-one.woff2) format("woff2"); }
      html, body { margin: 0; height: 100%; background: #1d130b; }
      #splash {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 42%, #4f3320 0%, #2e1c10 55%, #1d130b 100%);
        transition: opacity .35s ease, visibility 0s linear .35s;
        user-select: none; -webkit-user-select: none; cursor: default;
      }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .splash-logo {
        width: 168px; height: 168px; margin-bottom: -18px; /* the icon carries its own transparent margin */
        filter: drop-shadow(0 5px 0 #120b06) drop-shadow(0 16px 24px rgba(0,0,0,.5));
        animation: splash-bob 1.6s ease-in-out infinite;
      }
      #splash .splash-name {
        font: 400 34px "Lilita One", system-ui, sans-serif; letter-spacing: .5px; color: #fff;
        -webkit-text-stroke: 4px #1d130b; paint-order: stroke fill; text-shadow: 0 3px 0 #1d130b;
        opacity: 0; animation: splash-in .3s ease .1s forwards;
      }
      #splash .splash-bar {
        width: 180px; height: 12px; border-radius: 8px; overflow: hidden;
        background: #120b06; border: 2px solid #120b06; box-shadow: inset 0 2px 0 rgba(0,0,0,.4);
      }
      #splash .splash-bar span {
        display: block; height: 100%; width: 40%; border-radius: 6px;
        background: linear-gradient(180deg, #ffe27a 0%, #f5a623 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.55);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
      @keyframes splash-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes splash-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-logo { animation: none; }
        #splash .splash-bar span { animation-duration: 2.4s; }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Loading Clash of Claudes">
      <img class="splash-logo" src="/logo.png" alt="" draggable="false" />
      <div class="splash-name">Clash of Claudes</div>
      <div class="splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
